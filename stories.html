            <p>“When my son started with ActivateEd in the 3rd grade, he was nearly two grade behind in reading and our goal was to get him on track by middle school. With Liz’s help, he closed that gap in a year and was reading above grade level by the time he hit middle school. He is about to enter 9th grade, and was placed into Honors English! We saw such value that we’ve consistently continued with tutoring. ActivateEd’s approach is fun and engaging, and most importantly delivers results.”</p>
          </blockquote>

            <p>“Our child has been with Activate Education’s tutor for several years now - we can’t be more impressed with Liz’s passion and enthusiasm to help him improve his writing and excel even more at math. Liz is amazing at what she does and our son loves her! Highly recommended.”</p>

            <p>“Our son has been with Activate Education’s tutor for several years now, during which his reading and writing ability and confidence has improved immensely. We cannot recommend Activate enough. Liz is the best at what she does. Highly recommended.”</p>

          <span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span>
          <blockquote>
            <p>“Liz is running a fantastic service here for our children who need the extra help. Her specialized teaching model incorporates the unique needs of each student, as evidenced in her approach with our son. She uses the dedicated time efficiently by focusing on areas of strength that would yield the more immediate results. We love the method she uses to teach reading and letter recognition by honing in on essential sounds and word patterns. Her calming, patient, gentle nature is a great benefit in working with hyper children or those who need redirection. We appreciate all her great work and dedication to teaching.”</p>
          </blockquote>
          <figcaption><strong>Bejoy Chacko</strong><span>Google review</span></figcaption>
        </figure>
        <figure class="review-card">
          <span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span>
          <blockquote>
            <p>“Liz is an amazing teacher and her knowledge on how to teach tactics for a higher score is super effective- my son’s score went up and I was so grateful to the process. If you are looking for a great experience and results, go with Activate Education Westchester.”</p>
          </blockquote>
          <figcaption><strong>erika goyzueta</strong><span>Google review</span></figcaption>
        </figure>
        <figure class="review-card">
          <span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span>
          <blockquote>
            <p>“Our son has been with Liz from Activate Education for a few years now and he has been thriving in school ever since. Liz is truly a natural who cares about the children that she tutors and it shows when she is with them.”</p>
          </blockquote>
          <figcaption><strong>Bryan E</strong><span>Google review</span></figcaption>
        </figure>
        <figure class="review-card">
          <span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span>
          <blockquote>
            <p>“Activate Education has been a game-changer for our family. The tutors are patient and truly engage with each child at their level. Communication is clear and regular, so I always know how my daughter is progressing. Her confidence and grades have steadily improved since she started. I can’t recommend Activate Education enough!”</p>
          </blockquote>

        </figure>
        <figure class="review-card">
          <span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span>
          <blockquote>
            <p>“The owner, Liz, is a miracle worker. We owe all my daughter’s early education success to the hard work she and Liz put forth. Highly recommend her services.”</p>
          </blockquote>
          <figcaption><strong>Meghan Behzadi</strong><span>Google review</span></figcaption>
        </figure>
        <figure class="review-card">
          <span class="stars" role="img" aria-label="5 out of 5 stars">★★★★★</span>
          <blockquote>
            <p>“We’re so grateful to have found Liz and her team. My kid was more than a full year behind grade level in reading at the end of first grade, and super resistant to practice because it was so hard for him and he felt like a failure. A year on, he is virtually at grade level (ie, made two years’ progress in one). The sessions are fun and playful, with short intense blocks of work tailored to his specific needs, and broken up with rest and rewards (great for ADHD kids!). I’m so relieved and grateful for the expertise and support he has had. Highly recommended!!”</p>
          </blockquote>
