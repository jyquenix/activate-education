<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Gallery | ActivateEd</title>
  <!-- Main CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" />
  <link rel="stylesheet" href="style.css?v=11" />
</head>
<body>
  <!-- NAV -->
  <header class="glass-nav">
    <div class="nav-wrap container">
      <a href="index.html" class="brand logo">Activate<span>Ed</span></a>
      <button id="burger" aria-label="Menu"><span></span></button>
      <nav class="desktop-nav" id="mainNav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="approach.html">Curriculum</a>
        <a href="stories.html">Stories</a>
        <a class="active" href="gallery.html" aria-current="page">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button id="themeToggle" aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero-simple reveal">
    <div class="container">
      <h1 class="section-title">Learning in Action</h1>
      <p class="subhead">Real snapshots from our tutoring sessions &amp; workshops.</p>
    </div>
  </section>

  <!-- IMAGE-ONLY GALLERY -->
  <section class="section">
    <div class="container gallery-grid">
      <figure><button class="tile" type="button"><img src="images/gallery-01.jpg" loading="lazy" alt="Student highlighting a paragraph-planning organizer"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-03.jpg" loading="lazy" alt="Student writing a thank-you note on scratch paper"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-04.jpg" loading="lazy" alt="Place-value cards laid out beside a math workbook"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-05.jpg" loading="lazy" alt="Student drafting a paragraph from a main-idea organizer"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-08.jpg" loading="lazy" alt="Student ordering wooden numerals on the floor"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-09.jpg" loading="lazy" alt="Student sequencing number blocks outdoors"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-10.jpg" loading="lazy" alt="Student playing a sight-word board game"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-12.jpg" loading="lazy" alt="Vocabulary cards spread out during a reading session"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-13.jpg" loading="lazy" alt="Student working through a problem set at an outdoor table"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-14.jpg" loading="lazy" alt="Student annotating a multi-step math problem with highlighters"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-15.jpg" loading="lazy" alt="Student solving a subtraction word problem on color-coded sticky notes"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-16.jpg" loading="lazy" alt="Student working subtraction on grid paper beside reward tickets"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-17.jpg" loading="lazy" alt="Student writing on index cards with color markers beside a shark encyclopedia"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-18.jpg" loading="lazy" alt="Two students playing a ring-toss game on the floor"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-19.jpg" loading="lazy" alt="Student lining up numbered circles along a tape line on the floor"></button></figure>
      <figure><button class="tile" type="button"><img src="images/gallery-20.jpg" loading="lazy" alt="Student writing on a card at a coffee table"></button></figure>
    </div>
  </section>


  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev"  id="lbPrev"  type="button" aria-label="Previous photo">&#8249;</button>
    <img id="lbImg" src="" alt="">
    <button class="lb-btn lb-next"  id="lbNext"  type="button" aria-label="Next photo">&#8250;</button>
    <p class="lb-count" id="lbCount"></p>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>© 2025 ActivateEd</div>
      <ul class="socials">
        <li><a href="#"><img src="images/X_logo.png"         alt="X"></a></li>
        <li><a href="#"><img src="images/Facebook_Logo_(2019).png"  alt="Facebook"></a></li>
        <li><a href="#"><img src="images/Instagram_icon.png" alt="Instagram"></a></li>
      </ul>
    </div>
  </footer>

  <!-- Main JS -->
  <script src="script.js?v=9"></script>
  <script src="gallery.js?v=2"></script>
</body>
</html>
